services:
  # ── VPN egress with on-demand IP rotation (rate-limit bypass) ──────────────
  # Both the ProtonVPN container (protonvpn-cli, control API on :8000) and its
  # forward HTTP proxy (protonvpn-proxy / tinyproxy on :8888) are managed by the
  # separate protonvpn-cli-community stack at /srv/protonvpn-cli-community — the
  # proxy is defined there (not here) so it shares the VPN container's network
  # namespace AND recreates together with it, which is what keeps it from being
  # orphaned on a stale namespace when the VPN restarts. This app reaches them
  # on shared_net as http://protonvpn-cli:8888 (proxy, OUTBOUND_PROXY_URL) and
  # http://protonvpn-cli:8000 (rotation API, VPN_API_BASE_URL). Only provider
  # traffic is proxied; DB/DNS/raw-socket probes stay direct (utils/outbound.py).

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ip_intel
      POSTGRES_USER: ip_intel
      POSTGRES_PASSWORD: ip_intel
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ip_intel -d ip_intel"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Server-side response cache for the read endpoints (cases/cache.py). Kept on
  # the internal `default` network only — no published port, so it is reachable
  # from ip-intel and nothing else. Cache-only workload: persistence is off
  # (a cold cache re-warms itself on boot), and a hard memory ceiling with LRU
  # eviction stops a large pool payload from growing into the app's own budget.
  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  auth:
    build:
      context: .
      dockerfile: auth/Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://ip_intel:ip_intel@postgres:5432/ip_intel
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:9000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      AUTH_EMAIL_DOMAINS: ${AUTH_EMAIL_DOMAINS:-stratc.org}
      AUTH_MAIL_FROM: ${AUTH_MAIL_FROM:-}
      MATTERMOST_URL: ${MATTERMOST_URL:-}
      MATTERMOST_OAUTH_CLIENT_ID: ${MATTERMOST_OAUTH_CLIENT_ID:-}
      MATTERMOST_OAUTH_CLIENT_SECRET: ${MATTERMOST_OAUTH_CLIENT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  ip-intel:
    build: .
    ports:
      - "9000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://ip_intel:ip_intel@postgres:5432/ip_intel
      # Response cache. Unset/unreachable = every endpoint computes live, so
      # the app runs unchanged without the redis service (cases/cache.py).
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:9000}
      AUTH_PROXY_URL: http://auth:3000
      AUTH_JWKS_URL: http://auth:3000/api/auth/jwks
      AUTH_ISSUER: ${BETTER_AUTH_URL:-http://localhost:9000}
      AUTH_TRUSTED_PROXY_CIDRS: ${AUTH_TRUSTED_PROXY_CIDRS:-}
      # Empty by default = direct connection / no rotation, so runs without the
      # `vpn` profile work unchanged. To enable the rotating VPN egress, set in
      # .env (the `vpn` profile must be up):
      #   OUTBOUND_PROXY_URL=http://protonvpn-cli:8888   (tinyproxy in VPN netns)
      #   VPN_API_BASE_URL=http://protonvpn-cli:8000      (rotation control API)
      OUTBOUND_PROXY_URL: ${OUTBOUND_PROXY_URL:-}
      VPN_API_BASE_URL: ${VPN_API_BASE_URL:-}
      COUNTRY_CODES: ${COUNTRY_CODES:-NL, DE, LT}
      DEFAULT_COUNTRY_CODE: ${DEFAULT_COUNTRY_CODE:-}
      # Set to 1 to disable rotation even when the VPN is up (local/dev).
      VPN_ROTATE_DISABLE: ${VPN_ROTATE_DISABLE:-}
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 6g
    memswap_limit: 6g
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - default
      - shared_net

networks:
  # Shared cross-project network the ProtonVPN container lives on (same as
  # tiktok_tool). Created once with: docker network create shared_net
  shared_net:
    external: true
    name: shared_net
  default:

volumes:
  postgres_data:
